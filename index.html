<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aegisreach_theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisReach // AI Prospecting & CISO Decision Engine (UI/UX Case Study)</title>
    <meta name="description" content="An interactive enterprise B2B SaaS prototype and UX case study for threat-driven prospecting, CISO persona classification, and Gmail sequencing." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased overflow-x-hidden">
    <div id="root"></div>
    <noscript>AegisReach needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
